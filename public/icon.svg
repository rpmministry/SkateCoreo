<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="#090D16"/>
  <circle cx="256" cy="256" r="210" stroke="#1E293B" stroke-width="8" fill="none"/>
  
  <!-- Skate Blade & Artistic Curve (Bézier trail) -->
  <path d="M 90 380 C 180 430, 330 430, 420 380" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 120 360 C 200 400, 310 400, 390 360" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6"/>
  
  <!-- Artistic Boot Shape -->
  <path d="M 160 350 L 340 350 C 370 350, 385 330, 375 300 L 330 200 C 320 180, 320 120, 260 120 L 220 120 C 195 120, 185 140, 185 165 L 185 240 L 150 320 C 145 335, 150 350, 160 350 Z" fill="url(#skateGrad)"/>
  
  <!-- RollArt Star Emblem / Wheels -->
  <circle cx="180" cy="380" r="26" fill="#F59E0B"/>
  <circle cx="180" cy="380" r="14" fill="#090D16"/>
  <circle cx="330" cy="380" r="26" fill="#F59E0B"/>
  <circle cx="330" cy="380" r="14" fill="#090D16"/>
  
  <!-- Toe Stop / Pivot -->
  <circle cx="380" cy="365" r="15" fill="#EF4444"/>
