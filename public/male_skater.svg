<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100" width="100" height="100">
  <defs>
    <!-- Resplandor áurico de patinaje sobre hielo masculino (Cian/Azul real) -->
    <radialGradient id="m-skater-glow" cx="40%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Traje atlético de competición (Azul zafiro con detalles de corte) -->
    <linearGradient id="m-suit-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Pantalón elástico de competición -->
    <linearGradient id="m-pants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Cuchilla de patín de acero cromado -->
    <linearGradient id="m-steel-blade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="30%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Tono de piel del patinador -->
    <linearGradient id="m-skin-tone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
  </defs>

  <!-- 1. Halo cinemático de velocidad sobre el hielo -->
  <circle cx="0" cy="4" r="42" fill="url(#m-skater-glow)"/>

  <!-- 2. Surco de hielo tallado por la cuchilla (Hacia atrás -X) -->
  <path d="M -44 24 Q -20 22 2 20" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
  <path d="M -36 24.5 Q -14 22.5 4 20" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <!-- Destello de escarcha en el punto de contacto -->
  <circle cx="2" cy="20" r="2.5" fill="#FFFFFF" opacity="0.8"/>

  <!-- 3. PIERNA DE APOYO (Deslizándose sobre el hielo hacia +X) -->
  <!-- Pantalón elástico negro de competición -->
  <path d="M -3 0 L 2 15 L 0 17 L -6 2 Z" fill="url(#m-pants)"/>
  <!-- Bota negra de patinaje artístico masculino -->
  <path d="M -1 13 L 5 16 L 8 18 L 8 20 L -2 20 L -3 15 Z" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
  <!-- Cuchilla de patín cromada en el hielo -->
  <path d="M -5 21 L 12 21 Q 14 20.5 13 18" fill="none" stroke="url(#m-steel-blade)" stroke-width="2" stroke-linecap="round"/>
  <!-- Tacón y soporte de cuchilla -->
  <rect x="-2" y="19" width="3" height="2" fill="#64748B"/>
  <rect x="5" y="19" width="3" height="2" fill="#64748B"/>

  <!-- 4. PIERNA LIBRE EN ELEVACIÓN ARABESQUE (Extendida hacia atrás y arriba: -X, -Y) -->
  <!-- Pierna en pantalón negro extendida en ángulo atlético -->
  <path d="M -6 -2 L -28 -14 L -30 -12 L -8 2 Z" fill="url(#m-pants)"/>
  <!-- Bota negra de patinaje de la pierna libre en punta -->
  <path d="M -27 -13 L -36 -17 L -38 -16 L -35 -13 L -29 -11 Z" fill="#0F172A" stroke="#334155" stroke-width="0.7"/>
  <!-- Cuchilla de la pierna libre en el aire -->
  <line x1="-30" y1="-15" x2="-40" y2="-19" stroke="url(#m-steel-blade)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 5. TORSO DEL PATINADOR EN ARQUEO ATLÉTICO V-TAPER -->
  <path d="M -5 -3 C -2 -8, 5 -10, 9 -7 C 8 -1, 3 2, -2 3 Z" fill="url(#m-suit-body)" stroke="#38BDF8" stroke-width="0.8"/>
  <!-- Franja plateada geométrica en el pecho -->
  <path d="M 0 -7 L 8 -5 L 4 -2 Z" fill="#E2E8F0" opacity="0.9"/>

  <!-- 6. BRAZOS EN EXTENSIÓN POTENTE Y ARTÍSTICA -->
  <!-- Brazo trasero en contrapeso -->
  <path d="M -2 -6 C -10 -11, -18 -15, -24 -18" fill="none" stroke="url(#m-skin-tone)" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="-25" cy="-18.5" r="1.5" fill="#FED7AA"/>

  <!-- Brazo delantero guiando el avance hacia +X -->
  <path d="M 7 -6 C 15 -8, 23 -6, 29 -2" fill="none" stroke="url(#m-skin-tone)" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="30" cy="-1.5" r="1.5" fill="#FED7AA"/>

  <!-- 7. CUELLO Y CABEZA DEL PATINADOR -->
  <!-- Cuello atlético -->
  <path d="M 7 -8 L 9 -12 L 12 -10 L 10 -7 Z" fill="url(#m-skin-tone)"/>
  <!-- Cabeza mirando con determinación al frente (+X) -->
  <circle cx="12" cy="-13" r="5" fill="url(#m-skin-tone)"/>

  <!-- Cabello peinado hacia atrás con estilo moderno -->
  <path d="M 8 -15 C 9 -19, 15 -19, 16 -15 C 13 -14, 9 -13, 8 -15 Z" fill="#1E293B"/>
  <path d="M 12 -18 Q 16 -17 15 -14" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- 8. FLECHA INDICADORA DE FILO Y DIRECCIÓN (+X) -->
  <g transform="translate(36, 0)">
    <polygon points="0,0 -8,-5 -5,0 -8,5" fill="#F59E0B" stroke="#B45309" stroke-width="0.8"/>
  </g>
</svg>
