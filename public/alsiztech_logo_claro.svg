<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 258" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&amp;family=Inter:wght@700;800;900&amp;display=swap');
      .title { font-family: 'Montserrat', sans-serif; font-size: 54px; fill: #0F172A; }
      .bold { font-weight: 700; }
      .light { font-weight: 400; }
      .subtitle { font-family: 'Inter', sans-serif; font-size: 23px; font-weight: 800; fill: #0F172A; letter-spacing: 0.14em; }
    </style>
    <linearGradient id="gradColorClaro" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="45%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <!-- Isotipo de cinta gruesa proporcional -->
  <path d="M 105 138 L 160 42 L 215 138" fill="none" stroke="url(#gradColorClaro)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tipografía centrada debajo con alta legibilidad -->
  <text x="160" y="202" text-anchor="middle" class="title"><tspan class="bold">Alsiz</tspan><tspan class="light">Tech</tspan></text>
  <text x="160" y="238" text-anchor="middle" class="subtitle">AGENCIA DIGITAL</text>
</svg>